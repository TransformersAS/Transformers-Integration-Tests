name: Integration Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Run against the real backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4

      - name: Checkout system under test
        uses: actions/checkout@v4
        with:
          repository: TransformersAS/Transformers-AS
          path: backend-source
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend-source/backend/demo/pom.xml

      - name: Prepare backend environment
        working-directory: backend-source
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_LOCAL_APP_PASSWORD/ci-app-password/' .env
          sed -i 's/REPLACE_WITH_DIFFERENT_LOCAL_ROOT_PASSWORD/ci-root-password/' .env

      - name: Start backend and MySQL
        run: docker compose -f backend-source/compose.yaml up -d --build --wait

      - name: Wait for backend health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f backend-source/compose.yaml ps
          exit 1

      - name: Run integration tests
        env:
          BACKEND_BASE_URL: http://localhost:8080
        run: ./mvnw verify

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop backend and MySQL
        if: ${{ always() }}
        run: docker compose -f backend-source/compose.yaml down --volumes --remove-orphans