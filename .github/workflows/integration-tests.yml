name: Integration Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Run Maven and Playwright against the real Marketplace
    runs-on: ubuntu-24.04
    # Includes frontend/backend image builds and Chromium/system dependency downloads.
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: marketplace-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      # Secreto exclusivo de este entorno efímero: firma las novedades del proveedor logístico simulado.
      LOGISTICS_WEBHOOK_SECRET: ci-logistics-webhook-secret-${{ github.run_id }}
    steps:
      - name: Checkout integration tests
        uses: actions/checkout@v4

      - name: Checkout system under test
        uses: actions/checkout@v4
        with:
          repository: TransformersAS/Transformers-AS
          ref: main 
          path: backend-source
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            pom.xml
            backend-source/backend/demo/pom.xml

      - name: Prepare backend environment
        working-directory: backend-source
        run: |
          cp .env.example .env
          sed -i 's/REPLACE_WITH_LOCAL_APP_PASSWORD/ci-app-password/' .env
          sed -i 's/REPLACE_WITH_DIFFERENT_LOCAL_ROOT_PASSWORD/ci-root-password/' .env
          # El webhook logístico queda cerrado si el backend arranca sin secreto (CU-24 y CU-25).
          echo "LOGISTICS_WEBHOOK_SECRET=$LOGISTICS_WEBHOOK_SECRET" >> .env

      - name: Prepare E2E Compose override
        run: |
          cat > "$RUNNER_TEMP/compose.e2e.yaml" <<'YAML'
          services:
            backend:
              environment:
                SPRING_PROFILES_ACTIVE: local
          YAML

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Chromium
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Start MySQL, backend and frontend
        run: |
          docker compose \
            --env-file backend-source/.env \
            -f backend-source/compose.yaml \
            -f "$RUNNER_TEMP/compose.e2e.yaml" \
            up -d --build --wait --wait-timeout 300

      - name: Wait for backend readiness and frontend
        id: ready
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 5 http://localhost:8080/actuator/health/readiness | grep -q '"status":"UP"' \
              && curl --fail --silent --max-time 5 http://localhost:4300/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Marketplace did not become ready within the bounded health checks.'
          exit 1

      - name: Seed CU-20/CU-21 demo accounts
        # soporte.demo@example.com (rol SOPORTE) y la publicación de la tienda vecina que CU-21 necesita moderar; ese
        # rol no se autoregistra por API. Repetible: no duplica cuentas ni publicaciones.
        run: |
          DEMO_PASSWORD='MarketplaceDemo123!' \
          DB_PASSWORD='ci-app-password' \
          MYSQL_CONTAINER="${COMPOSE_PROJECT_NAME}-mysql-1" \
          backend-source/scripts/cu20-demo-seed.sh

      - name: Seed the category CU-21 needs to publish content
        # Publicar exige una categoría activa; la tabla `categories` empieza vacía y crearlas es solo-ADMIN, sin
        # cuenta de prueba disponible para eso.
        run: |
          docker exec -i -e MYSQL_PWD=ci-app-password "${COMPOSE_PROJECT_NAME}-mysql-1" \
            mysql --default-character-set=utf8mb4 -umarketplace_app marketplace -e \
            "INSERT INTO categories(name, active) SELECT 'Hogar', TRUE FROM DUAL \
             WHERE NOT EXISTS (SELECT 1 FROM categories WHERE name = 'Hogar');"

      - name: Run integration tests
        env:
          BACKEND_BASE_URL: http://localhost:8080
        run: ./mvnw verify

      - name: Run Playwright E2E
        # Still collect E2E results if Maven fails, provided setup succeeded.
        if: ${{ !cancelled() && steps.ready.outcome == 'success' && steps.chromium.outcome == 'success' }}
        env:
          FRONTEND_BASE_URL: http://localhost:4300
          E2E_EMAIL: demo@marketplace.local
          E2E_PASSWORD: MarketplaceDemo123!
        run: npm run test:e2e

      - name: Capture Docker logs on failure
        if: ${{ failure() }}
        run: |
          if [[ -f backend-source/.env && -f "$RUNNER_TEMP/compose.e2e.yaml" ]]; then
            mkdir -p docker-logs
            docker compose \
              --env-file backend-source/.env \
              -f backend-source/compose.yaml \
              -f "$RUNNER_TEMP/compose.e2e.yaml" \
              logs --no-color > docker-logs/compose.log 2>&1
          fi

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports-${{ github.sha }}
          path: |
            target/surefire-reports/
            playwright-report/
            test-results/
            docker-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Marketplace and remove volumes
        if: ${{ always() }}
        run: |
          if [[ -f backend-source/.env && -f "$RUNNER_TEMP/compose.e2e.yaml" ]]; then
            docker compose \
              --env-file backend-source/.env \
              -f backend-source/compose.yaml \
              -f "$RUNNER_TEMP/compose.e2e.yaml" \
              down --volumes --remove-orphans
          fi
