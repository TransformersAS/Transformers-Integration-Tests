services:
  mysql:
    image: mysql:8.4.11
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: cu10_e2e
      MYSQL_USER: cu10_test
      MYSQL_PASSWORD: cu10_test_only
      MYSQL_ROOT_PASSWORD: cu10_root_test_only
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 40
  mailpit:
    image: axllent/mailpit:v1.27
  backend:
    build:
      context: ${CU10_BACKEND_CONTEXT:?}
      dockerfile: ${CU10_DOCKERFILE:?}
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cu10_e2e
      DB_USER: cu10_test
      DB_PASSWORD: cu10_test_only
      SPRING_PROFILES_ACTIVE: local,compose-local
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:${CU10_PORT:-14310}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "false"
      NOTIFICATIONS_PROVIDER: simulated
      NOTIFICATIONS_SIMULATED_MODE: UNAVAILABLE
      EMAIL_VERIFICATION_FROM: marketplace@example.test
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/actuator/health/readiness]
      interval: 5s
      timeout: 5s
      retries: 60
  frontend:
    build: ${CU10_FRONTEND_CONTEXT:?}
    ports: ["127.0.0.1:${CU10_PORT:-14310}:80"]
    depends_on:
      backend:
        condition: service_healthy
