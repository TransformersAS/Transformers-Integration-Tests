# Dedicated disposable project. No production database, payment credentials or shared volumes.
services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: cu11_e2e
      MYSQL_USER: cu11_test
      MYSQL_PASSWORD: cu11_test_only
      MYSQL_ROOT_PASSWORD: cu11_root_test_only
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 40
  backend:
    build:
      context: ${CU11_APP_DIR:?Set the identified application source}/backend/demo
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cu11_e2e
      DB_USER: cu11_test
      DB_PASSWORD: cu11_test_only
      PAYMENTS_MOCK_ENABLED: 'false'
      PAYMENTS_RECOVERY_ENABLED: 'false'
      PAYMENTS_REFUND_SIMULATED_MODE: ${CU11_REFUND_MODE:-OK}
      MERCADOPAGO_ACCESS_TOKEN: ''
      MERCADOPAGO_WEBHOOK_SECRET: ''
      MERCADOPAGO_COLLECTOR_ID: ''
      NOTIFICATIONS_QUEUE_ENABLED: 'false'
      NOTIFICATIONS_PUSH_ENABLED: 'false'
      LOGISTICS_TRACKING_POLLING_ENABLED: 'false'
      INVENTORY_ALERTS_SCHEDULING_ENABLED: 'false'
      RETURNS_SWEEP_ENABLED: 'false'
      STORES_SUSPENSIONS_SWEEP_ENABLED: 'false'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, 'http://127.0.0.1:8080/actuator/health/readiness']
      interval: 3s
      timeout: 5s
      retries: 60
  frontend:
    build:
      context: ${CU11_APP_DIR:?Set the identified application source}/frontend
    ports:
      - '127.0.0.1:${CU11_PORT:-14311}:80'
    depends_on:
      backend:
        condition: service_healthy
